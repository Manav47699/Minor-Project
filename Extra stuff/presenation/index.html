<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Fitness System Survey Mockup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
    color:black;
    padding:30px;
}

.wrapper{
    width:75%;
    margin:auto;
}

.title{
    border:5px solid black;
    text-align:center;
    padding:20px;
    font-size:44px;
    font-weight:bold;
    margin-bottom:25px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.section{
    border:5px solid black;
    padding:15px;
    min-height:700px;
}

.section-title{
    border-bottom:4px solid black;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    padding-bottom:10px;
    margin-bottom:20px;
}

.block{
    border:3px solid black;
    text-align:center;
    padding:18px;
    margin-bottom:15px;
    font-size:30px;
    font-weight:bold;
}

.subheading{
    font-size:28px;
    font-weight:bold;
    margin-bottom:12px;
    text-align:center;
}

.footer{
    margin-top:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="title">
        INITIAL USER SURVEY
    </div>

    <div class="container">

        <!-- GENERAL SETUP -->
        <div class="section">

            <div class="section-title">
                GENERAL SETUP
            </div>

            <div class="block">Weight</div>

            <div class="block">Height</div>

            <div class="block">Veg / Non-Veg</div>

            <div class="block">Age</div>

            <div class="block">Gender</div>

            <div class="block">etc.</div>

        </div>

        <!-- CONSTRAINTS -->
        <div class="section">

            <div class="section-title">
                CONSTRAINTS
            </div>

            <div class="subheading">
                Health
            </div>

            <div class="block">Diabetes</div>

            <div class="block">High BP</div>

            <div class="block">Other</div>

            <div class="subheading" style="margin-top:20px;">
                Social
            </div>

            <div class="block">Shrawan Fast</div>

            <div class="block">Ekadashi Fast</div>

            <div class="block">Mourning Period</div>

        </div>

        <!-- FITNESS GOAL -->
        <div class="section">

            <div class="section-title">
                FITNESS GOAL
            </div>

            <div class="block">Lose / Gain</div>

            <div class="block">Target (kg)</div>

            <div class="block">Duration (Months)</div>

        </div>

    </div>

    <div class="footer">
        AI-Based Personalized Nepali Fitness & Diet Planning System
    </div>

</div>

</body>
</html>
